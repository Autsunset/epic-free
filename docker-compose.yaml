name: epic-free

services:
  epic-free:
    # Published by .github/workflows/docker.yml. Forks: change this to your own GHCR path.
    image: ghcr.io/autsunset/epic-free:latest
    restart: always
    container_name: epic-free

    environment:
      - TZ=Asia/Shanghai

      # ----------------------------------------
      # Epic account
      # ----------------------------------------
      - EPIC_EMAIL=your_email@example.com
      - EPIC_PASSWORD=your_password

      # ----------------------------------------
      # LLM provider — pick ONE: openai | anthropic | gemini
      # GLM/ZhipuAI users: use openai with OPENAI_BASE_URL pointed at the GLM
      # endpoint and OPENAI_MODEL set to a glm-* model.
      # ----------------------------------------

      # --- OpenAI (Chat Completions or Responses API) ---
      - LLM_PROVIDER=openai
      - OPENAI_API_KEY=sk-xxxxxxxxxxxxxxxxxxxxxxxx
      - OPENAI_BASE_URL=https://api.openai.com/v1
      - OPENAI_MODEL=gpt-4.1-mini
      # Wire format: chat (default) | responses
      # - OPENAI_API_FORMAT=chat

      # Switch to Anthropic (Claude models) instead:
      # - LLM_PROVIDER=anthropic
      # - ANTHROPIC_API_KEY=sk-ant-xxxxxxxxxxxxxxxxxxxxxxxx
      # - ANTHROPIC_BASE_URL=https://api.anthropic.com
      # - ANTHROPIC_MODEL=claude-sonnet-5

      # Switch to Gemini / AiHubMix instead:
      # - LLM_PROVIDER=gemini
      # - GEMINI_API_KEY=your_gemini_api_key
      # - GEMINI_BASE_URL=
      # - GEMINI_MODEL=gemini-2.5-pro

      # ----------------------------------------
      # Runtime
      # ----------------------------------------
      - BROWSER_BACKEND=auto
      - ENABLE_APSCHEDULER=true

      # Hard cap (seconds) for a single collection run. A hung browser is
      # aborted so the scheduler retries on its next tick. Default 900; 0 = off.
      # - TASK_TIMEOUT_SECONDS=900

      # ----------------------------------------
      # Disk-artifact retention — ON BY DEFAULT (30 days)
      # Each run deletes volumes/ files older than N days so the directory does
      # not grow forever on an always-on container. The 30-day default applies
      # even while these stay commented; uncomment ONLY to change the window,
      # or set 0 to keep everything forever.
      # ----------------------------------------
      # - RECORD_RETENTION_DAYS=30     # browser recordings (volumes/record)
      # - RUNTIME_RETENTION_DAYS=30    # debug screenshots + hcaptcha caches

      # ----------------------------------------
      # Advanced tuning (optional)
      # All of the following are real fields inherited from hcaptcha-challenger's
      # AgentConfig — uncomment and adjust as needed.
      # ----------------------------------------
      # - DISABLE_BEZIER_TRAJECTORY=false
      # - EXECUTION_TIMEOUT=120            # seconds, per-step hard limit
      # - RESPONSE_TIMEOUT=30              # seconds, LLM HTTP response wait
      # - RETRY_ON_FAILURE=true
      # - WAIT_FOR_CHALLENGE_VIEW_TO_RENDER_MS=1500
      #
      # Per-task model overrides — leave empty to follow the provider's default
      # model set above (OPENAI_MODEL / ANTHROPIC_MODEL / GEMINI_MODEL).
      # - CHALLENGE_CLASSIFIER_MODEL=
      # - IMAGE_CLASSIFIER_MODEL=
      # - SPATIAL_POINT_REASONER_MODEL=
      # - SPATIAL_PATH_REASONER_MODEL=

    volumes:
      - "./volumes/:/app/volumes/"

    mem_limit: 4g
    shm_size: 2gb
